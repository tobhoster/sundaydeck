[workspace]
resolver = "2"
members = [
    "crates/sundaydeck-core",
    "crates/sundaydeck-db",
    "crates/sundaydeck-overlay",
    "crates/sundaydeck-planner",
    "crates/sundaydeck-voice",
    "crates/sundaydeck-ui",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["SundayDeck Contributors"]

[workspace.dependencies]
sundaydeck-core = { path = "crates/sundaydeck-core" }
sundaydeck-db = { path = "crates/sundaydeck-db" }
sundaydeck-overlay = { path = "crates/sundaydeck-overlay" }
sundaydeck-planner = { path = "crates/sundaydeck-planner" }
sundaydeck-voice = { path = "crates/sundaydeck-voice" }

anyhow = "1.0"
async-channel = "2.5"
chrono = { version = "0.4", features = ["clock", "serde"] }
cpal = "0.18"
gpui = { package = "mhr-gpui", version = "0.2.0" }
gpui_platform = { package = "mhr-gpui-platform", version = "0.2.0", features = ["wayland", "x11", "font-kit"] }
gpui_screenshot = { package = "mhr-gpui-screenshot", version = "0.2.0" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
quick-xml = "0.41"
rusqlite = { version = "0.43", features = ["bundled", "modern_sqlite"] }
rust-embed = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tracing = "0.1"
ureq = "3"
uuid = { version = "1.29", features = ["v5", "v7", "serde"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
