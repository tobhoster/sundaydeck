name: Release Installers (macOS, Windows, Linux)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional version label for manual test build (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: macOS DMG (${{ matrix.arch_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch_label: arm64
          - os: macos-15-intel
            arch_label: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout SundayDeck
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Import Apple Developer ID certificate (optional)
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE_P12:-}" || -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            echo "No Apple Developer ID secrets configured — using ad-hoc signing."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/sundaydeck-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Build SundayDeck.app and macOS DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x scripts/build-macos-dmg.sh
          ./scripts/build-macos-dmg.sh

      - name: Remove temporary signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sundaydeck-signing.keychain-db" "$RUNNER_TEMP/developer-id.p12"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch_label }}
          path: dist/*.dmg
          if-no-files-found: error

  build-linux:
    name: Linux (.deb + .tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SundayDeck
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build Linux .tar.gz and .deb packages
        run: |
          chmod +x scripts/build-linux-packages.sh
          ./scripts/build-linux-packages.sh

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  build-windows:
    name: Windows (.exe Installer + Portable .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout SundayDeck
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build Windows portable ZIP and Inno Setup EXE installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release & Homebrew Cask
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout SundayDeck
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build Verified Public Domain Starter Packs (.sdeck-pack)
        run: python3 scripts/build-starter-packs.py --out-dir release-assets

      - name: Generate SHA256SUMS and updated Homebrew Cask
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          chmod +x scripts/update-homebrew-cask.sh
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$GITHUB_REF_TYPE" != "tag" ]]; then
            VERSION="$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)"
          fi
          ./scripts/update-homebrew-cask.sh "$GITHUB_REPOSITORY" "$VERSION" release-assets > release-assets/sundaydeck.rb

      - name: Upload combined release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: sundaydeck-release-all
          path: release-assets/*

      - name: Attest Build Provenance (SLSA / Sigstore)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.deb
            release-assets/*.tar.gz
            release-assets/*.sdeck-pack

      - name: Publish GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.deb
            release-assets/*.tar.gz
            release-assets/*.sdeck-pack
            release-assets/SHA256SUMS.txt
            release-assets/sundaydeck.rb
